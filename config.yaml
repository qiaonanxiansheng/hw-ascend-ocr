# ascend-ocr 配置文件
# OCR 流水线的所有可配置参数

# ======================== 模型路径 ========================
# 模型按芯片类型存放在 models/ 目录下
# 目录结构: models/{芯片型号}/{det,rec,rotate}.om
chip: "910B4-1"

# 模型路径自动根据 chip 拼接: models/{chip}/{det,rec,rotate,layout}.om
# 如需覆盖特定模型，取消注释并修改:
# det_model: "models/310/det.om"
# rec_model: "models/310/rec.om"
# rotate_model: "models/310/rotate.om"

# 识别字典路径（留空则使用内置默认字典）
rec_char_dict: ""

# NPU 设备 ID
device_id: 0

# 是否进行大角度分类（0/90/180/270度）并自动转正
# 如果输入图片已经是正向的，或没有分类模型，可以关闭
# 可在调用时通过 use_rotate 参数覆盖
use_rotate: true

# 是否启用调试可视化
debug: true

# ======================== 文字检测 ========================
det:
  # 缩放后图片的最大边长。值越大精度越高，速度越慢
  limit_side_len: 960

  # 高度和宽度需要对齐的倍数（模型要求）
  limit_multiple: 32

  # 静态模型的固定输入尺寸 (高, 宽)，从模型自动检测
  # fixed_input_size: null

  # 缩放策略: "pad" | "stretch" | "crop_center"
  #   pad         - 保持宽高比，用 pad_color 填充（精度最高）
  #   stretch     - 拉伸到目标尺寸（速度最快，可能变形）
  #   crop_center - 居中裁剪到目标尺寸
  resize_mode: "pad"

  # 填充颜色 [B, G, R]，当 resize_mode == "pad" 时使用
  pad_color: [0, 0, 0]

  # 归一化方式: "imagenet" | "ppocr" | "none" | "custom"
  #   imagenet - mean=[0.485,0.456,0.406], std=[0.229,0.224,0.225], scale=1/255
  #   ppocr    - mean=[0.5,0.5,0.5],      std=[0.5,0.5,0.5],      scale=1/255
  #   none     - 仅除以 255
  #   custom   - 使用下面的 mean/std/scale 字段
  normalize_mode: "custom"

  # 自定义归一化参数（当 normalize_mode == "custom" 时使用）
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  scale: 0.00392156862745098  # 1/255

  # ---- DBNet 后处理 ----

  # 概率图二值化阈值
  thresh: 0.35

  # 候选框内最小平均概率，低于此值的框会被过滤
  box_thresh: 0.25

  # 多边形扩展比例。1.0 = 不扩展，1.5~2.0 = 标准 DB unclip
  unclip_ratio: 1.75

  # 框面积的最小/最大值（原图像素），超出范围的框会被过滤
  min_box_area: 10.0
  max_box_area: .inf

  # 框宽高比（宽/高）的最小/最大值
  min_aspect_ratio: 0.05
  max_aspect_ratio: 50.0

  # 最大检测框数量
  max_candidates: 1000

  # 框的表示方式: "minarearect" | "poly" | "quad"
  #   minarearect - 4点最小外接矩形（推荐用于识别）
  #   poly        - 原始近似多边形（点数更多，较慢）
  #   quad        - 与 minarearect 相同，但显式返回 4 个点
  box_type: "minarearect"

  # 使用 pyclipper 进行精确多边形扩展，不可用时自动回退
  use_pyclipper: true

  # 在查找轮廓前对二值图进行膨胀，可连接断裂笔画，但可能合并相邻框
  use_dilate: false
  dilate_kernel_size: 2

  # 候选框之间的 NMS 阈值，<0 表示不使用 NMS
  nms_threshold: -1.0

  # 阅读顺序排序: "natural" | "top2bottom" | "left2right"
  #   natural    - 将框分组为文本行后排序（默认）
  #   top2bottom - 严格从上到下，再从左到右
  #   left2right - 严格从左到右，再从上到下
  sort_mode: "natural"

  # 控制框分组为文本行的紧密程度，仅在 sort_mode == "natural" 时生效
  # 值越小分行越多，值越大分行越少
  line_cluster_factor: 0.5

# ======================== 文字识别 ========================
rec:
  # 固定输入形状 (C, H, W)，静态模型会自动检测
  rec_image_shape: [3, 48, 320]

  # 最大宽度，超出的图片会被压缩，不足的会填充
  max_text_width: 320

  # 最小宽度（像素），保证有足够的 CTC 时间步
  min_text_width: 96

  # 缩放策略: "fixed_height_pad" | "fixed_size_stretch" | "fixed_height_stretch"
  #   fixed_height_pad     - 固定高度，填充到目标宽度（保持宽高比）
  #   fixed_size_stretch   - 拉伸到 rec_image_shape（速度最快）
  #   fixed_height_stretch - 固定高度，拉伸宽度到目标值（可能变形）
  resize_mode: "fixed_height_pad"

  # 填充对齐方式: "left" | "center" | "right"
  #   left   - 文字靠左，右边填充（PP-OCR 训练约定）
  #   center - 文字居中，两边填充
  #   right  - 文字靠右，左边填充
  pad_align: "left"

  # 归一化方式: "imagenet" | "ppocr" | "none" | "custom"
  normalize_mode: "ppocr"

  # 自定义归一化参数
  mean: [0.5, 0.5, 0.5]
  std: [0.5, 0.5, 0.5]
  scale: 0.00392156862745098  # 1/255

  # CTC 空白索引。0 = 第一个类别（PP-OCR 约定），-1 = 最后一个类别
  blank_index: 0

  # 识别批处理大小，动态形状模型始终逐个推理
  batch_size: 8

  # 置信度低时是否尝试 180 度翻转校正（会运行两次推理）
  use_direction_ensemble: false
  direction_ensemble_thresh: 0.6

# ======================== 角度校正 ========================
rotate:
  # 输入尺寸 (C, H, W)
  rotate_image_shape: [3, 512, 512]

  # 类别索引 -> 旋转角度（度，逆时针），顺序必须与模型输出一致
  label_list: [0, 180, 270, 90]

  # 归一化方式: "imagenet" | "ppocr" | "none" | "custom"
  normalize_mode: "ppocr"

  # 自定义归一化参数
  mean: [0.5, 0.5, 0.5]
  std: [0.5, 0.5, 0.5]
  scale: 0.00392156862745098  # 1/255
